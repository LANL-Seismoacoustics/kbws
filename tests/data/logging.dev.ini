[loggers]
keys=root

[handlers]
keys=console

[formatters]
keys=standard

[logger_root]
level=DEBUG
handlers=console

[handler_console]
class=StreamHandler
level=DEBUG
formatter=standard
args=()

[formatter_standard]
format=%(levelname)s - %(asctime)s - %(name)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
