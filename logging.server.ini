[loggers]
keys=root

[handlers]
keys=rotating_file

[formatters]
keys=standard

[logger_root]
level=INFO
handlers=rotating_file

[handler_rotating_file]
class=handlers.RotatingFileHandler
level=INFO
formatter=standard
args=('/tmp/logs/kbws.log', 'a', 10485760, 5)

[formatter_standard]
format=%(levelname)s - %(asctime)s - %(name)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
