name: Install and Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      LOG_LEVEL: INFO
      AFFILIATION: test.affiliation
      ARRIVAL: test.arrival
      ASSOC: test.assoc
      EVENT: test.event
      INSTRUMENT: test.instrument
      NETMAG: test.netmag
      NETWORK: test.network
      ORIGIN: test.origin
      SENSOR: test.sensor
      SITE: test.site
      SITECHAN: test.sitechan
      WFDISC: test.wfdisc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: dev
      - name: Test with pytest
        run: pixi run -e dev pytest -v
